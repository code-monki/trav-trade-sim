<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hld-architecture-title hld-architecture-desc">
      <title id="hld-architecture-title">Trav Trade Sim system architecture</title>
      <desc id="hld-architecture-desc">Architecture diagram showing the browser SPA's views, Pinia stores, and deterministic trade engine making two independent outbound calls: one through a Cloudflare Worker to D1, the only thing that talks to the database, and a separate direct client-side call to the third-party Traveller Map API that never touches the Worker.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS (drawn before boxes) ============ -->

      <!-- Views -> Pinia Stores -->
      <line x1="520" y1="136" x2="520" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Pinia Stores -> Trade Engine -->
      <line x1="520" y1="224" x2="520" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Browser -> Cloudflare Worker (via api.js, HTTPS/Bearer) -->
      <line x1="284" y1="328" x2="284" y2="392" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="292" y="354" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="363" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS · BEARER</text>

      <!-- Browser -> Traveller Map (direct client-side fetch) -->
      <line x1="784" y1="328" x2="784" y2="392" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="792" y="354" width="92" height="12" rx="2" fill="#f5f5f5"/>
      <text x="796" y="363" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DIRECT FETCH</text>

      <!-- Cloudflare Worker -> D1 -->
      <line x1="284" y1="520" x2="284" y2="568" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="292" y="538" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="547" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">D1 BINDING</text>

      <!-- ============ ZONE: Browser (Vue 3 SPA) ============ -->
      <rect x="40" y="40" width="960" height="288" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="56" y="44" width="192" height="12" rx="2" fill="#f5f5f5"/>
      <text x="60" y="53" fill="#2d3142" fill-opacity="0.40" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BROWSER · VUE 3 SPA</text>

      <!-- Node: Views -->
      <rect x="64" y="72" width="912" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="72" width="912" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="76" y="80" width="36" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="94" y="89" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIEW</text>
      <text x="520" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Views</text>
      <text x="520" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LoginView · MapView · RefereeView · Components</text>

      <!-- Node: Pinia Stores -->
      <rect x="64" y="160" width="912" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="160" width="912" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="76" y="168" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="96" y="177" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="520" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pinia Stores</text>
      <text x="520" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">auth · map · tick · ship · referee · theme</text>

      <!-- Node: Trade Engine -->
      <rect x="64" y="248" width="912" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="248" width="912" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="76" y="256" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="96" y="265" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOGIC</text>
      <text x="520" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Trade Engine · Market Tick · Events</text>
      <text x="520" y="292" fill="#7a8399" font-style="italic" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">pure JS — deterministic, no side effects</text>

      <!-- ============ Cloudflare Worker (focal) ============ -->
      <rect x="64" y="392" width="440" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="392" width="440" height="128" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.5"/>
      <rect x="76" y="400" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="90" y="409" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="284" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare Worker (Hono v4)</text>
      <text x="284" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/api/auth · /api/campaigns · /api/ships</text>
      <text x="284" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/api/market · /api/referee · /api/reports · /api/health</text>
      <text x="284" y="484" fill="#7a8399" font-style="italic" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">the only thing that talks to D1</text>

      <!-- ============ Cloudflare D1 (store) ============ -->
      <rect x="64" y="568" width="440" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="568" width="440" height="136" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="76" y="576" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="88" y="585" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="284" y="600" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare D1 (SQLite)</text>
      <text x="284" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">campaigns · players · ships · crew · cargo</text>
      <text x="284" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">market_snapshots · trade_records · organizations · debts</text>
      <text x="284" y="656" fill="#7a8399" font-style="italic" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">plus schema_migrations and 12 more tables</text>

      <!-- ============ Traveller Map API (external) ============ -->
      <rect x="568" y="392" width="432" height="140" rx="6" fill="#f5f5f5"/>
      <rect x="568" y="392" width="432" height="140" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="580" y="400" width="64" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="612" y="409" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
      <text x="784" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Traveller Map API</text>
      <text x="784" y="448" fill="#7a8399" font-style="italic" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">travellermap.com — third-party, not affiliated</text>
      <text x="784" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sector/world/route data · UWP decode</text>
      <text x="784" y="484" fill="#7a8399" font-style="italic" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">cached in IndexedDB as a fallback</text>
      <text x="784" y="500" fill="#7a8399" font-style="italic" font-size="8" font-family="'Geist', sans-serif" text-anchor="middle">never touches the Worker</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="736" x2="1000" y2="736" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="756" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="748" width="12" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.5"/>
      <text x="160" y="757" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FOCAL · PRIMARY INTEGRATION POINT</text>

      <rect x="420" y="748" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="440" y="757" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STATE / DATA STORE</text>

      <rect x="640" y="748" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="757" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">VIEW / LOGIC STEP</text>

      <rect x="840" y="748" width="12" height="12" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <text x="860" y="757" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL / THIRD-PARTY</text>
    </svg>
